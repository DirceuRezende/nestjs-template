# Postgres + Kafka + Grafana LGTM (OpenTelemetry) para desenvolvimento local (npm run infra:up). Os testes usam Testcontainers, não este arquivo.
name: user-template-node   # sem isto o projeto compose herdaria o nome da pasta e colidiria com o template Java

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0   # KRaft, um nó só; a config padrão da imagem já expõe localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.41.1   # coletor OTel + Tempo (traces) + Prometheus (métricas) + Loki (logs) + Grafana
    ports:
      - "3000:3000"   # Grafana (admin/admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (padrão do app)
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]   # o da imagem, com intervalo menor para o --wait
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
