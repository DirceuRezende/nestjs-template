# Postgres + Kafka para desenvolvimento local (npm run infra:up). Os testes usam Testcontainers, não este arquivo.
name: user-template-node   # sem isto o projeto compose herdaria o nome da pasta e colidiria com o template Java

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0   # KRaft, um nó só; a config padrão da imagem já expõe localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
